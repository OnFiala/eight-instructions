name: Verify the experiment
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite: [core, literal-modules, literal-processes, literal-contexts, synthesis, synthesis-reclaim]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts
      - run: npm run verify:ci -- ${{ matrix.suite }}
      - run: git diff --exit-code
  verify:
    needs: tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every test suite must pass
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success
